{% extends "base.html" %}

{% block title %}Login | Moonlit Crystals{% endblock %}

{% block content %}
<section class="panel" style="max-width:480px;margin:24px auto;">
  <h1 style="margin-top:0;">Login</h1>
  <p class="muted">Use your shop account to view your orders.</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email</label>
    <input name="user_email" type="email" required value="demo@example.com">
    <label>Password</label>
    <input name="user_password" type="password" required value="demo123">
    <p><button class="primary" type="submit">Login</button></p>
  </form>
  <p class="muted">New to Moonlit Crystals?</p>
  <p><a class="button" href="{% url 'signup' %}">Sign up</a></p>
</section>
{% endblock %}
